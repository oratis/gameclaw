steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:latest'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gameclaw'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/gameclaw-repo/gameclaw:latest'

options:
  logging: CLOUD_LOGGING_ONLY
